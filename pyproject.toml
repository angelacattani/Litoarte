[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litoarte"
version = "2.0.0.dev0"
description = "Composição de custos e formação de preço de venda"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "nicegui>=4.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
litoarte = "litoarte.app.main:iniciar"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["litoarte*"]

[tool.setuptools.package-data]
litoarte = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
main_file = "main.py"
addopts = "-p nicegui.testing.user_plugin"
