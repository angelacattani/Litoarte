[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-custos"
version = "0.1.0"
description = "Cadastro de custos e formação de preço de venda (markup divisor)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["custos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
